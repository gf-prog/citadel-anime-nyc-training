<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Citadel Anime NYC Employee Training video">
  <title>Citadel Anime NYC Employee Training</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f7f8fa;
      background: radial-gradient(circle at top, #293444 0, #121820 45%, #090d12 100%);
    }
    main { width: min(100%, 1100px); text-align: center; }
    .eyebrow {
      margin: 0 0 10px;
      color: #b7c0cb;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(1.8rem, 5vw, 3.4rem);
      line-height: 1.08;
      letter-spacing: -.035em;
    }
    .player {
      overflow: hidden;
      padding: 7px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 18px;
      background: rgba(255,255,255,.06);
      box-shadow: 0 28px 80px rgba(0,0,0,.42);
    }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      background: #000;
    }
    .note { margin: 18px 0 0; color: #aeb7c2; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Employee Training</p>
    <h1>Citadel Anime NYC Employee Training</h1>
    <div class="player">
      <video controls playsinline preload="metadata">
        <source src="training-video.mp4" type="video/mp4">
        Your browser does not support this training video.
      </video>
    </div>
    <p class="note">Please watch the complete video before your shift.</p>
  </main>
</body>
</html>
